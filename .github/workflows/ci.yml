name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc binutils make
      - name: Build and test (SHARD, ELF loader, SHARD to ELF round trip)
        run: make test
      - name: Mutation test under ASan and UBSan
        run: make fuzz
      - name: Run a SHARD image converted to ELF natively (must exit 42)
        run: |
          ./build/shardelf tests/fixture/exit42.shard build/exit42.so
          chmod +x build/exit42.so
          ./build/exit42.so; test $? -eq 42
      - name: Convert the sample with shardelf and inspect the ELF
        run: |
          ./build/shardelf build/sample.shard build/ci-sample.so
          readelf -h build/ci-sample.so
          readelf -l build/ci-sample.so
          readelf -d build/ci-sample.so
      - name: Upload converted sample
        uses: actions/upload-artifact@v4
        with:
          name: sharelf-sample
          path: build/ci-sample.so
